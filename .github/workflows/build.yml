name: Build Kernel

on:
  push:
    branches: [ "master", "main", "**" ]
  pull_request:
    branches: [ "master", "main", "**" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2
        # Set python2 as default python
        sudo ln -f -s /usr/bin/python2 /usr/bin/python

    - name: Download Toolchains
      run: |
        mkdir -p toolchains
        cd toolchains

        # Download Clang r365631c
        mkdir clang-r365631c
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r3/clang-r365631c.tar.gz
        tar -xf clang-r365631c.tar.gz -C clang-r365631c
        rm clang-r365631c.tar.gz

        # Download GCC 4.9 aarch64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-17.1 aarch64-linux-android-4.9

        # Download GCC 4.9 arm
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-17.1 arm-linux-androideabi-4.9

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchains/clang-r365631c/bin:$GITHUB_WORKSPACE/toolchains/aarch64-linux-android-4.9/bin:$GITHUB_WORKSPACE/toolchains/arm-linux-androideabi-4.9/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        echo "Building sdm670_defconfig..."
        make O=out sdm670_defconfig

        echo "Compiling kernel..."
        make O=out CC=clang -j$(nproc --all)
